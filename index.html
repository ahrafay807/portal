<!doctype html>
<html lang="en">
<head>

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #12161F; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  #fallback {
    display: none; position: fixed; inset: 0; background: #12161F; color: #F5F5F5;

    flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  #fallback .logo { width: 56px; height: 56px; border-radius: 12px; background: #C8102E; color: #fff; font-weight: 700;

  #fallback h1 { font-size: 18px; margin: 0 0 10px; }
  #fallback p { font-size: 14px; color: #AAAAAA; margin: 0 0 24px; max-width: 380px; }
  #direct { position: fixed; right: 12px; bottom: 12px; z-index: 5; background: rgba(18,22,31,.85); color: #fff;

    opacity: .35; transition: opacity .2s; }
  #direct:hover, #direct:focus { opacity: 1; }
  #fallback a { display: inline-block; background: #C8102E; color: #fff; text-decoration: none; font-weight: 700;
    font-size: 14px; padding: 12px 28px; border-radius: 8px; }
</style>
</head>
<body>

<iframe id="app-frame"
